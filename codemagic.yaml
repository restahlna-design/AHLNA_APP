workflows:
  ios_unsigned_release:
    name: iOS Unsigned IPA (Release)
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      groups:
        - supabase
      vars:
        FLUTTER_VERSION: "3.24.5"
        CM_NETWORK_TIMEOUT: 600
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ".*"
          include: true
          source: true
    scripts:
      - name: Pre-build setup (network & environment)
        script: |
          echo "== Pre-build network optimization =="
          export CURL_TIMEOUT=600
          export CURL_CONNECT_TIMEOUT=30
          export FLUTTER_STORAGE_BASE_URL=https://storage.googleapis.com
          
      - name: iOS Official IPA Build & Strict Verification
        script: |
          set -eo pipefail
          export SUPABASE_URL="${SUPABASE_URL:-https://boylzidmvvldouxtrpiv.supabase.co}"
          export SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-}"
          export SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-}"

          echo "== Git Build Information =="
          echo "Commit SHA: $(git rev-parse HEAD)"
          echo "Commit Message: $(git log -1 --pretty=%B)"
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Flutter Version: $(flutter --version | head -n 1)"
          echo "Build Time: $(date)"

          echo "== Clean previous build artifacts =="
          rm -rf build
          flutter clean
          flutter pub get

          echo "== CocoaPods Installation =="
          cd ios
          pod install --repo-update || pod install
          cd ..

          echo "== Ensure iOS permissions in Info.plist =="
          cat > update_plist.dart <<'DART'
          import 'dart:io';
          void main() {
            final plistPath = 'ios/Runner/Info.plist';
            final file = File(plistPath);
            if (!file.existsSync()) exit(1);
            String content = file.readAsStringSync();
            bool changed = false;

            String ensureStringKey(String text, String key, String value) {
              final regex = RegExp('<key>' + key + r'<\/key>\s*<string>[^<]*<\/string>', multiLine: true);
              if (regex.hasMatch(text)) {
                text = text.replaceAll(regex, '<key>' + key + '</key>
    <string>' + value + '</string>');
                changed = true;
              } else {
                final insertPoint = text.lastIndexOf('</dict>');
                if (insertPoint != -1) {
                  final injection = '  <key>' + key + '</key>
  <string>' + value + '</string>
';
                  text = text.substring(0, insertPoint) + injection + text.substring(insertPoint);
                  changed = true;
                }
              }
              return text;
            }

            content = ensureStringKey(content, 'NSLocalNetworkUsageDescription', 'نحتاج الوصول للشبكة للاتصال بقاعدة البيانات والخادم');
            content = ensureStringKey(content, 'NSLocationWhenInUseUsageDescription', 'موقعك مطلوب لتوصيل الطلب');
            content = ensureStringKey(content, 'NSPhotoLibraryUsageDescription', 'نحتاج الوصول للصور لاختيار وحفظ الصور');
            if (changed) file.writeAsStringSync(content);
          }
          DART
          dart update_plist.dart

          echo "== Prepare IPA output directory =="
          mkdir -p build/ios/ipa

          echo "== 1. Build Customer iOS (Official flutter build ipa) =="
          flutter build ipa --release --no-codesign             --target lib/main.dart             --dart-define=SUPABASE_URL="${SUPABASE_URL}"             --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}"             --dart-define=SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY}"

          echo "== Locate and standardize Customer_App.ipa =="
          if [ -f build/ios/ipa/*.ipa ]; then
            CUSTOMER_FOUND=$(find build/ios/ipa -name "*.ipa" | head -n 1)
            mv "$CUSTOMER_FOUND" build/ios/ipa/Customer_App.ipa
          elif [ -d build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app ]; then
            echo "Packaging from official Xcode Archive..."
            mkdir -p build/ios/ipa_tmp/Payload
            cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa_tmp/Payload/
            pushd build/ios/ipa_tmp >/dev/null
            zip -r Customer_App.ipa Payload
            mv Customer_App.ipa ../ipa/Customer_App.ipa
            popd >/dev/null
            rm -rf build/ios/ipa_tmp
          elif [ -d build/ios/iphoneos/Runner.app ]; then
            echo "Packaging from release Runner.app..."
            mkdir -p build/ios/ipa_tmp/Payload
            cp -R build/ios/iphoneos/Runner.app build/ios/ipa_tmp/Payload/
            pushd build/ios/ipa_tmp >/dev/null
            zip -r Customer_App.ipa Payload
            mv Customer_App.ipa ../ipa/Customer_App.ipa
            popd >/dev/null
            rm -rf build/ios/ipa_tmp
          fi

          echo "== 2. Strict Artifact Verification for Customer_App.ipa =="
          cat > verify_ipa.dart <<'DART'
          import 'dart:io';
          import 'dart:convert';
          import 'package:crypto/crypto.dart';
          import 'package:archive/archive_io.dart';

          void main() {
            final ipaFile = File('build/ios/ipa/Customer_App.ipa');
            if (!ipaFile.existsSync()) {
              stderr.writeln('❌ FATAL: Customer_App.ipa was not found in build/ios/ipa!');
              exit(1);
            }

            final bytes = ipaFile.readAsBytesSync();
            final digest = sha256.convert(bytes);
            stdout.writeln('
======================================================');
            stdout.writeln('📋 CUSTOMER IPA ARTIFACT VERIFICATION:');
            stdout.writeln('File: Customer_App.ipa');
            stdout.writeln('Size: ${bytes.length} bytes (${(bytes.length / (1024 * 1024)).toStringAsFixed(2)} MB)');
            stdout.writeln('SHA-256: ${digest.toString().toUpperCase()}');

            final inputStream = InputFileStream('build/ios/ipa/Customer_App.ipa');
            final archive = ZipDecoder().decodeBuffer(inputStream);
            
            bool foundDiagString = false;
            for (final file in archive) {
              if (file.name.contains('App.framework/App')) {
                final content = file.content as List<int>;
                final str = utf8.decode(content, allowMalformed: true);
                if (str.contains('DIAGNOSTIC TEST: BUILD e7a3bf0')) {
                  foundDiagString = true;
                }
              }
            }

            if (foundDiagString) {
              stdout.writeln('🎯 DIAGNOSTIC BUILD FOUND INSIDE FINAL IPA: YES');
              stdout.writeln('======================================================
');
            } else {
              stderr.writeln('❌ FATAL: DIAGNOSTIC TEST STRING NOT FOUND IN FINAL IPA!');
              stderr.writeln('Build failed because final IPA does not contain latest code.');
              exit(1);
            }
          }
          DART
          dart verify_ipa.dart

          echo "== 3. Clean environment for Admin build =="
          rm -rf build/ios/archive
          rm -rf build/ios/iphoneos

          echo "== 4. Build Admin iOS (Official flutter build ipa) =="
          # Update Info.plist for Admin
          ADMIN_PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Ahlna Admin" "$ADMIN_PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Ahlna Admin" "$ADMIN_PLIST" 2>/dev/null || true

          flutter build ipa --release --no-codesign             --target lib/admin/main_admin.dart             --dart-define=SUPABASE_URL="${SUPABASE_URL}"             --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}"             --dart-define=SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY}"

          echo "== Locate and standardize Admin_App.ipa =="
          if [ -d build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app ]; then
            mkdir -p build/ios/ipa_tmp/Payload
            cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa_tmp/Payload/
            pushd build/ios/ipa_tmp >/dev/null
            zip -r Admin_App.ipa Payload
            mv Admin_App.ipa ../ipa/Admin_App.ipa
            popd >/dev/null
            rm -rf build/ios/ipa_tmp
          elif [ -d build/ios/iphoneos/Runner.app ]; then
            mkdir -p build/ios/ipa_tmp/Payload
            cp -R build/ios/iphoneos/Runner.app build/ios/ipa_tmp/Payload/
            pushd build/ios/ipa_tmp >/dev/null
            zip -r Admin_App.ipa Payload
            mv Admin_App.ipa ../ipa/Admin_App.ipa
            popd >/dev/null
            rm -rf build/ios/ipa_tmp
          fi

          echo "== Revert Admin Info.plist changes in source =="
          git checkout ios/Runner/Info.plist || true

          echo "== Bundle Dual-IPAs =="
          pushd build/ios/ipa >/dev/null
          rm -f Dual-IPAs.zip || true
          zip -r Dual-IPAs.zip Customer_App.ipa Admin_App.ipa || true
          popd >/dev/null

          echo "== Final IPA Artifacts Summary =="
          ls -lah build/ios/ipa/
    artifacts:
      - build/ios/ipa/Customer_App.ipa
      - build/ios/ipa/Admin_App.ipa
      - build/ios/ipa/Dual-IPAs.zip
    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

  android_release:
    name: Android APK (Release)
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        ANDROID_HOME: /opt/android-sdk
      groups:
        - supabase
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ".*"
          include: true
          source: true
    scripts:
      - name: Flutter clean & pub get
        script: |
          flutter clean
          flutter pub get
      - name: Build Android Release APK (env vars)
        script: |
          set -e
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
      - name: List APK artifacts
        script: |
          ls -lah build/app/outputs/flutter-apk/ || true
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/**/**/app-release.apk
