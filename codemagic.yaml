workflows:
  ios_app_store_release:
    name: iOS App Store Release
    max_build_duration: 120
    integrations:
      app_store_connect: Ahlna Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.ahlnaDaquq
      flutter: stable
      xcode: latest
      groups:
        - supabase
        - app_store_credentials
      vars:
        FLUTTER_VERSION: "3.24.5"
        CM_NETWORK_TIMEOUT: 600
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
    scripts:
      - name: Pre-build setup
        script: |
          echo "== Pre-build network optimization =="
          export CURL_TIMEOUT=600
          export CURL_CONNECT_TIMEOUT=30
          export FLUTTER_STORAGE_BASE_URL=https://storage.googleapis.com

      - name: Flutter clean & Dependencies
        script: |
          echo "== Clean previous build artifacts =="
          flutter clean
          flutter pub get
          cd ios
          pod deintegrate || true
          pod install --repo-update || pod install
          cd ..

      - name: Set up code signing settings on Codemagic
        script: |
          echo "== Setting up official Apple Code Signing Profiles =="
          xcode-project use-profiles || true

      - name: Build Official Release IPA (Customer App)
        script: |
          set -eo pipefail
          export SUPABASE_URL="${SUPABASE_URL:-https://boylzidmvvldouxtrpiv.supabase.co}"
          export SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-}"

          echo "== Git Build Information =="
          echo "Commit SHA: $(git rev-parse HEAD)"
          echo "Flutter Version: $(flutter --version | head -n 1)"
          echo "Xcode Version: $(xcodebuild -version | head -n 1)"
          echo "Build Time: $(date)"

          # Build official Release IPA with automatic code signing
          flutter build ipa --release \
            --target lib/main.dart \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}"

          echo "== Final Artifact Verification =="
          ls -lah build/ios/ipa/
          shasum -a 256 build/ios/ipa/*.ipa || true
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

  android_release:
    name: Android APK (Release)
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        ANDROID_HOME: /opt/android-sdk
      groups:
        - supabase
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ".*"
          include: true
          source: true
    scripts:
      - name: Flutter clean & pub get
        script: |
          flutter clean
          flutter pub get
      - name: Build Android Release APK (env vars)
        script: |
          set -e
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
      - name: List APK artifacts
        script: |
          ls -lah build/app/outputs/flutter-apk/ || true
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/**/**/app-release.apk
