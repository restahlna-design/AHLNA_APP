workflows:
  ios-app-store-release:
    name: iOS App Store Connect Release
    max_build_duration: 120
    integrations:
      app_store_connect: Ahlna Key
    environment:
      flutter: stable
      xcode: latest
      groups:
        - supabase
        - app_store_credentials
      vars:
        FLUTTER_VERSION: "3.24.5"
        CM_NETWORK_TIMEOUT: 600
        APP_STORE_APPLE_ID: 6804920766
        BUNDLE_ID: "com.example.ahlnaDaquq"
        DEVELOPMENT_TEAM: "5H78CJ2GN6"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
    scripts:
      - name: Pre-build setup
        script: |
          echo "== Pre-build network optimization =="
          export CURL_TIMEOUT=600
          export CURL_CONNECT_TIMEOUT=30
          export FLUTTER_STORAGE_BASE_URL=https://storage.googleapis.com

      - name: Flutter clean & Dependencies
        script: |
          echo "== Clean previous build artifacts =="
          flutter clean
          flutter pub get
          cd ios
          pod deintegrate || true
          pod install --repo-update || pod install
          cd ..

      - name: Fetch active Apple signing files & Configure Code Signing
        script: |
          echo "== Initializing clean keychain =="
          keychain initialize
          
          echo "== Fetching active distribution signing files for $BUNDLE_ID =="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          
          echo "== Adding active certificates to keychain =="
          keychain add-certificates
          
          echo "== Applying provisioning profile to Xcode project =="
          xcode-project use-profiles
          
          echo "== Generating complete ExportOptions.plist =="
          PROFILE_NAME=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" -exec strings {} + 2>/dev/null | grep -A1 "<key>Name</key>" | grep "<string>" | head -n 1 | sed -e 's/.*<string>\(.*\)<\/string>.*/\1/')
          if [ -z "$PROFILE_NAME" ]; then
            PROFILE_NAME="Ahlna Daquq App Store"
          fi
          echo "Detected Profile Name: $PROFILE_NAME"
          
          cat <<EOF > /Users/builder/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>5H78CJ2GN6</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.example.ahlnaDaquq</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          
          echo "== ExportOptions.plist Content =="
          cat /Users/builder/export_options.plist

      - name: Build Official Signed Release IPA (Customer App)
        script: |
          set -eo pipefail
          export SUPABASE_URL="${SUPABASE_URL:-https://boylzidmvvldouxtrpiv.supabase.co}"
          export SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-}"

          echo "== Git Build Information =="
          echo "Commit SHA: $(git rev-parse HEAD)"
          echo "Flutter Version: $(flutter --version | head -n 1)"
          echo "Xcode Version: $(xcodebuild -version | head -n 1)"
          echo "Build Time: $(date)"

          flutter build ipa --release \
            --target lib/main.dart \
            --export-options-plist /Users/builder/export_options.plist \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}"

          echo "== Final Signed Artifact Verification =="
          mkdir -p build/ios/ipa
          if [ ! -f build/ios/ipa/*.ipa ] && [ -d build/ios/archive/Runner.xcarchive ]; then
            echo "Exporting IPA via xcodebuild from archive..."
            xcodebuild -exportArchive \
              -archivePath build/ios/archive/Runner.xcarchive \
              -exportPath build/ios/ipa \
              -exportOptionsPlist /Users/builder/export_options.plist
          fi

          ls -lah build/ios/ipa/
          shasum -a 256 build/ios/ipa/*.ipa || true
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true

