workflows:
  ios-app-store-release:
    name: iOS App Store Connect Official Release
    max_build_duration: 120
    integrations:
      app_store_connect: Ahlna Key
    environment:
      flutter: stable
      xcode: latest
      groups:
        - supabase
        - app_store_credentials
      vars:
        FLUTTER_VERSION: "3.24.5"
        CM_NETWORK_TIMEOUT: 600
        APP_STORE_APPLE_ID: 6804920766
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
    scripts:
      - name: Pre-build setup
        script: |
          echo "== Pre-build network optimization =="
          export CURL_TIMEOUT=600
          export CURL_CONNECT_TIMEOUT=30
          export FLUTTER_STORAGE_BASE_URL=https://storage.googleapis.com

      - name: Clean previous artifacts and dependencies
        script: |
          echo "== Clean previous build artifacts =="
          flutter clean
          flutter pub get
          cd ios
          pod deintegrate || true
          pod install --repo-update || pod install
          cd ..

      - name: Create or Fetch Official Apple Distribution Certificate via Ahlna Key
        script: |
          set -e
          echo "== Initializing clean keychain =="
          keychain initialize

          echo "== Existing Apple Certificates on Developer Account =="
          app-store-connect certificates list || true

          echo "== Generating 2048-bit RSA Private Key =="
          CERT_KEY="/Users/builder/cert_key.pem"
          openssl genrsa -out "$CERT_KEY" 2048

          echo "== Managing Distribution Certificate Slots on Apple Developer Account =="
          app-store-connect certificates delete CN623NV4PC || true
          python3 -c '
import subprocess, re
try:
    output = subprocess.check_output(["app-store-connect", "certificates", "list"]).decode("utf-8", errors="replace")
    blocks = output.split("-- Signing Certificate --")
    dist_ids = []
    for b in blocks:
        if "Type: DISTRIBUTION" in b:
            m = re.search(r"Id:\s*([A-Z0-9]+)", b)
            if m:
                dist_ids.append(m.group(1))
    print("Found active distribution certificate IDs:", dist_ids)
    if len(dist_ids) >= 2:
        for cid in dist_ids[:-1]:
            print(f"Deleting older certificate {cid} to free up distribution slot...")
            subprocess.run(["app-store-connect", "certificates", "delete", cid])
except Exception as e:
    print("Notice during certificate slot check:", e)
' || true

          echo "== Fetching or Generating App Store Provisioning Profile and Distribution Certificate =="
          if ! app-store-connect fetch-signing-files "com.example.ahlnaDaquq" \
            --type IOS_APP_STORE \
            --create \
            --delete-stale-profiles \
            --certificate-key="@file:$CERT_KEY" \
            --p12-password "codemagic"; then
            echo "Retrying after cleaning additional certificate collision..."
            python3 -c '
import subprocess, re
try:
    output = subprocess.check_output(["app-store-connect", "certificates", "list"]).decode("utf-8", errors="replace")
    blocks = output.split("-- Signing Certificate --")
    for b in blocks:
        if "Type: DISTRIBUTION" in b:
            m = re.search(r"Id:\s*([A-Z0-9]+)", b)
            if m:
                print(f"Emergency deleting certificate {m.group(1)}...")
                subprocess.run(["app-store-connect", "certificates", "delete", m.group(1)])
                break
except Exception as e:
    print("Emergency cleanup error:", e)
' || true
            app-store-connect fetch-signing-files "com.example.ahlnaDaquq" \
              --type IOS_APP_STORE \
              --create \
              --delete-stale-profiles \
              --certificate-key="@file:$CERT_KEY" \
              --p12-password "codemagic"
          fi

          echo "== Adding Valid Certificates to Keychain =="
          keychain add-certificates --certificate-password "codemagic" || keychain add-certificates || true

          echo "== Verifying Installed Identities in Keychain =="
          security find-identity -v -p codesigning || true

          echo "== Configuring Xcode Project Profiles =="
          xcode-project use-profiles --export-options-plist="/Users/builder/export_options.plist"

          echo "== Checking Generated Export Options =="
          cat /Users/builder/export_options.plist || true

      - name: Build Official Signed Release IPA (Customer App)
        script: |
          set -eo pipefail
          export SUPABASE_URL="${SUPABASE_URL:-https://boylzidmvvldouxtrpiv.supabase.co}"
          export SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-}"

          echo "== Git Build Information =="
          echo "Commit SHA: $(git rev-parse HEAD)"
          echo "Flutter Version: $(flutter --version | head -n 1)"
          echo "Xcode Version: $(xcodebuild -version | head -n 1)"
          echo "Build Time: $(date)"

          EXPORT_PLIST="/Users/builder/export_options.plist"
          if [ ! -f "$EXPORT_PLIST" ]; then
            EXPORT_PLIST="${HOME}/export_options.plist"
          fi
          
          echo "== Export Options Plist Content =="
          cat "$EXPORT_PLIST" || true

          flutter build ipa --release \
            --target lib/main.dart \
            --export-options-plist "$EXPORT_PLIST" \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}"

          echo "== Final Artifact Verification =="
          ls -lah build/ios/ipa/*.ipa || true
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android_release:
    name: Android APK (Release)
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        ANDROID_HOME: /opt/android-sdk
      groups:
        - supabase
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ".*"
          include: true
          source: true
    scripts:
      - name: Flutter clean & pub get
        script: |
          flutter clean
          flutter pub get
      - name: Build Android Release APK (env vars)
        script: |
          set -e
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
      - name: List APK artifacts
        script: |
          ls -lah build/app/outputs/flutter-apk/ || true
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/**/**/app-release.apk
