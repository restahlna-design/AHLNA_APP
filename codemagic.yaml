workflows:
  ios-app-store-release:
    name: iOS Release IPA (Unsigned)
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      groups:
        - supabase
      vars:
        FLUTTER_VERSION: "3.24.5"
        CM_NETWORK_TIMEOUT: 600
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
    scripts:
      - name: Pre-build setup
        script: |
          echo "== Pre-build network optimization =="
          export CURL_TIMEOUT=600
          export CURL_CONNECT_TIMEOUT=30
          export FLUTTER_STORAGE_BASE_URL=https://storage.googleapis.com

      - name: Flutter clean & Dependencies
        script: |
          echo "== Clean previous build artifacts =="
          flutter clean
          flutter pub get
          cd ios
          pod deintegrate || true
          pod install --repo-update || pod install
          cd ..

      - name: Build Unsigned Release IPA (Customer App)
        script: |
          set -eo pipefail
          export SUPABASE_URL="${SUPABASE_URL:-https://boylzidmvvldouxtrpiv.supabase.co}"
          export SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-}"

          echo "== Git Build Information =="
          echo "Commit SHA: $(git rev-parse HEAD)"
          echo "Flutter Version: $(flutter --version | head -n 1)"
          echo "Xcode Version: $(xcodebuild -version | head -n 1)"
          echo "Build Time: $(date)"

          flutter build ios --release --no-codesign \
            --target lib/main.dart \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}"

          echo "== Packaging Unsigned IPA =="
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr ahlna_daquq_unsigned.ipa Payload
          rm -rf Payload

          echo "== Verification of Unsigned IPA =="
          ls -lah ahlna_daquq_unsigned.ipa
          shasum -a 256 ahlna_daquq_unsigned.ipa
    artifacts:
      - build/ios/ipa/*.ipa

  ios_app_store_release:
    name: iOS Release IPA (Unsigned Legacy Alias)
    max_build_duration: 120
